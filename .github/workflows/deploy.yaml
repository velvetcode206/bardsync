name: Deploy

on:
  push:
    branches: [development, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Access secrets
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  # Computed values
  D1_DATABASE: ${{ github.ref == 'refs/heads/main' && 'bardsync-production' || 'bardsync-development' }}
  CLOUDFLARE_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

jobs:
  deploy:
    name: Deploy app to cloudflare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      url: ${{ steps.cloudflare-deploy.outputs.deployment-url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply "$D1_DATABASE" --remote

      - name: Build project
        run: pnpm build

      - name: Setup worker name
        run: |
          NAME="${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME,,}"
          NAME="${NAME//[^a-z0-9]/-}"
          echo "WORKER_NAME=${NAME:0:63}" >> "$GITHUB_ENV"

      - name: Verify Cloudflare credentials are present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Token is missing"
            exit 1
          fi
          echo "Token is present"

      - name: Deploy to Cloudflare Workers
        id: cloudflare-deploy
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          command: deploy --config .output/server/wrangler.json --name="${{ env.WORKER_NAME }}"
