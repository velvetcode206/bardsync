shellEmulator: true
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
supportedArchitectures:
  cpu:
    - current
    - x64
    - arm64
  os:
    - linux
    - current
trustPolicy: no-downgrade

trustPolicyExclude:
  - semver
  - chokidar
  - undici
